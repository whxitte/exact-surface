# Public read-only demo — https://demo.exactsurface.com
#
# This is NOT a customer deployment. It is one of the three things the vendor hosts
# (marketing site, this demo, control plane); customers run the real product themselves.
#
# Two things make it safe to expose:
#
#   1. EXACTSURFACE_DEMO_MODE=true — the API refuses every state-changing request in
#      middleware, before routing. Not a frontend concern; see api/demo.py.
#   2. There is no worker and no scheduler. A public instance therefore has no way to
#      launch a scan at anybody, which matters far more than the read-only flag: a
#      scanner exposed to the internet with a "scan" button would be a liability
#      regardless of who could click it.
#
# Deploy:  docker compose -f docker-compose.demo.yml up -d
# Reseed:  docker compose -f docker-compose.demo.yml run --rm seeder

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [demo-mongo:/data/db]
    # Not published. Only the demo API talks to it.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      EXACTSURFACE_DEMO_MODE: "true"
      EXACTSURFACE_ENV: demo
      EXACTSURFACE_MONGO_URI: mongodb://mongo:27017
      EXACTSURFACE_MONGO_DB: exactsurface_demo
      # A demo signs its own tokens with a throwaway secret. Nothing of value is behind
      # this login — the account is public and can change nothing.
      EXACTSURFACE_JWT_SECRET: ${DEMO_JWT_SECRET:?set DEMO_JWT_SECRET in .env}
      EXACTSURFACE_CORS_ALLOWED_ORIGINS: ${DEMO_ORIGIN:-https://demo.exactsurface.com}
      # Public signup stays closed; the seeded demo account is the only way in.
      EXACTSURFACE_ALLOW_PUBLIC_SIGNUP: "false"
    ports: ["8000:8000"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on: [api]
    environment:
      # The real frontend, unmodified. It reads /public-config and shows the demo
      # banner + disables its controls — cosmetic; the API is what enforces.
      NEXT_PUBLIC_API_URL: ${DEMO_API_URL:-https://demo.exactsurface.com/api}
    ports: ["3000:3000"]

  # One-shot seeder. Run it whenever you want a clean demo.
  seeder:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      EXACTSURFACE_MONGO_URI: mongodb://mongo:27017
      EXACTSURFACE_MONGO_DB: exactsurface_demo
      EXACTSURFACE_JWT_SECRET: ${DEMO_JWT_SECRET:?set DEMO_JWT_SECRET in .env}
    command: ["python", "-m", "scripts.seed_demo"]
    restart: "no"

  # Re-seeds on a timer. Writes are already blocked, so this is belt-and-braces: it
  # guarantees the demo is identical for every visitor no matter what has happened,
  # and it refreshes the relative timestamps so "2 hours ago" stays true.
  reseeder:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      mongo: {condition: service_healthy}
    environment:
      EXACTSURFACE_MONGO_URI: mongodb://mongo:27017
      EXACTSURFACE_MONGO_DB: exactsurface_demo
      EXACTSURFACE_JWT_SECRET: ${DEMO_JWT_SECRET:?set DEMO_JWT_SECRET in .env}
      RESEED_INTERVAL_SECONDS: ${DEMO_RESEED_SECONDS:-21600}   # 6 hours
    command:
      - sh
      - -c
      - |
        while true; do
          python -m scripts.seed_demo || echo "reseed failed; retrying next cycle"
          sleep "$${RESEED_INTERVAL_SECONDS}"
        done

volumes:
  demo-mongo:
