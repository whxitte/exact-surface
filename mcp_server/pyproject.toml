[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exactsurface-mcp"
version = "0.1.0"
description = "MCP server for ExactSurface — lets an AI agent read attack-surface data and run scans through a scoped API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=2,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/whxitte/exact-surface"
Documentation = "https://github.com/whxitte/exact-surface/blob/main/mcp_server/README.md"

[project.scripts]
exactsurface-mcp = "exactsurface_mcp.server:main"

[tool.setuptools]
packages = ["exactsurface_mcp"]
