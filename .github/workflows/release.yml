# Release: cut a versioned, customer-installable build.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces, for that version:
#   * api, frontend and pipeline images on GHCR (ghcr.io), tagged :X.Y.Z and :latest,
#     with the licence verify-key and build id baked in
#   * a GitHub Release recording the image digests
#
# Registry: GHCR, not Docker Hub. Docker Hub's free tier allows only ONE private repo
# and we publish three images; GHCR gives unlimited private packages and authenticates
# with the built-in GITHUB_TOKEN, so there are no registry secrets to manage.
#
# Required repository secret (one):
#   LICENSE_PUBLIC_KEY    Ed25519 PUBLIC key PEM — verify-only, safe to bake in.
#                         The PRIVATE key never touches CI; it stays on your machine
#                         and on the control plane.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0) — no leading v"
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

env:
  # ghcr.io/<owner>/<image> — lowercased at use, since GHCR rejects uppercase paths.
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  # A release must never ship a red build. This repeats CI deliberately: tags can be
  # pushed from a branch that never ran it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Version matches pyproject
        run: |
          PY_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$PY_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.v.outputs.version }} != pyproject version $PY_VERSION."
            echo "Bump pyproject.toml before tagging."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            # api + frontend are pure interpreted/JS layers, so multi-arch is cheap.
            platforms: linux/amd64,linux/arm64
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            platforms: linux/amd64,linux/arm64
          - name: pipeline
            dockerfile: docker/Dockerfile.pipeline
            # amd64 only: this image compiles the Go recon toolchain, and building it
            # for arm64 under QEMU emulation takes hours. Nearly all customer servers
            # are amd64. Add linux/arm64 here if you ever need Graviton/Apple silicon.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase the registry namespace (GHCR requires it)
        id: ns
        run: echo "value=$(echo '${{ env.REGISTRY_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The verify key is a multi-line PEM, and `build-args:` is a newline-delimited
      # KEY=VALUE list -- passed raw, it truncates to "-----BEGIN PUBLIC KEY-----" and
      # every image ships unable to verify any licence. v1.0.0 shipped exactly that.
      # Local builds were fine (compose's `args:` mapping keeps newlines), so this was
      # only ever visible in a published image. Collapse it to one line here;
      # core.config accepts base64 or PEM.
      - name: Collapse the verify key to a single line
        id: pubkey
        run: |
          echo "b64=$(printf '%s' "${{ secrets.LICENSE_PUBLIC_KEY }}" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Fail early if the verify key is missing or malformed
        run: |
          KEY="$(printf '%s' '${{ steps.pubkey.outputs.b64 }}' | base64 -d 2>/dev/null || true)"
          case "$KEY" in
            *"BEGIN PUBLIC KEY"*"END PUBLIC KEY"*) echo "verify key looks well-formed" ;;
            *) echo "::error::LICENSE_PUBLIC_KEY secret is empty or not a full PEM. Images built from it cannot verify any licence, so every customer would be permanently read-only." ; exit 1 ;;
          esac

      - name: Build + push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ns.outputs.value }}/${{ matrix.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.ns.outputs.value }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_ID=${{ needs.verify.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            LICENSE_PUBLIC_KEY=${{ steps.pubkey.outputs.b64 }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # mode=min + ignore-error, both deliberate.
          #
          # mode=max exports every intermediate layer. The pipeline image carries the Go
          # recon toolchain, the nuclei corpus and the wordlists, and its full layer set
          # does not fit the 10 GB per-repo Actions cache — the export failed *after* the
          # image had already been pushed, so the release job went red while GHCR showed
          # a perfectly good package. mode=min caches the final layers only.
          #
          # ignore-error matters more than the mode: a build cache is a speed
          # optimisation, and once the image is published and its digest recorded, a
          # failed cache write has no bearing on whether the release is good. It must
          # never be what turns a successful release red.
          cache-to: type=gha,mode=min,scope=${{ matrix.name }},ignore-error=true

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.ns.outputs.value }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*.txt

  # Pull what we just published and use it. Every release-path defect we have shipped
  # was invisible to the unit suite and obvious the moment a published image was run:
  # a scope-data file that was never committed, and a verify key truncated to its first
  # line by the build-arg channel — which meant no customer could license the product at
  # all. Local builds passed in both cases, because a local build is not the artifact.
  #
  # This asserts, against the real image, the things that were broken:
  #   * the build stamp is the version we think we released;
  #   * the baked verify key is the FULL secret, not a fragment of it;
  #   * the scope engine loads real ranges (an empty feed is worse than a missing one —
  #     it would silently classify every CDN address as ordinary scannable space);
  #   * every module still resolves to a pipeline route.
  #
  # It cannot sign a licence: the private key is offline and must never reach CI. So it
  # compares the shipped key to the intended key, which is exactly the check that would
  # have caught the truncation.
  verify-published:
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and interrogate the published api image
        env:
          EXPECTED_KEY: ${{ secrets.LICENSE_PUBLIC_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NS=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="$NS/api:$VERSION"
          docker pull -q "$IMAGE"

          echo "$EXPECTED_KEY" > expected.pem
          docker run --rm -v "$PWD/expected.pem:/tmp/expected.pem:ro" -e "VERSION=$VERSION" "$IMAGE" python - <<'PY'
          import os, sys, asyncio
          from pathlib import Path
          from core.build_info import VERSION, RELEASE_BUILD
          from core.config import get_settings
          from core.scope import ScopeEngine
          from pipelines.dispatch import ROUTES
          from core.modules import MODULE_NAMES

          fail = []
          if not RELEASE_BUILD:
              fail.append("image is not stamped as a release build")
          if VERSION != os.environ["VERSION"]:
              fail.append(f"build stamp is {VERSION!r}, expected {os.environ['VERSION']!r}")

          baked = (get_settings().license_public_key or "").strip()
          expected = Path("/tmp/expected.pem").read_text().strip()
          if not baked:
              fail.append("no verify key baked in — every licence would fail to verify")
          elif baked != expected:
              # The v1.0.0 failure: the PEM truncated to its first line in transit.
              fail.append(
                  f"baked verify key does not match the secret "
                  f"(baked {len(baked.splitlines())} line(s), expected {len(expected.splitlines())})"
              )

          ranges = ScopeEngine.from_data_file()._ranges
          total = sum(len(v) for v in ranges.values())
          if total < 20:
              fail.append(f"scope feed has only {total} range(s) — a near-empty feed "
                          "would let CDN addresses be treated as scannable")

          missing = [m for m in MODULE_NAMES if m not in ROUTES]
          if missing:
              fail.append(f"modules with no pipeline route: {missing}")

          if fail:
              print("PUBLISHED IMAGE IS NOT SHIPPABLE:")
              for f in fail:
                  print("  -", f)
              sys.exit(1)
          print(f"published image OK: {VERSION}, verify key matches the secret, "
                f"{total} scope ranges, {len(ROUTES)} module routes")
          PY

  release:
    needs: [verify, images, verify-published]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Compose release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## ExactSurface $VERSION"
            echo
            NS=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "### Images"
            echo '```'
            echo "docker pull $NS/api:$VERSION"
            echo "docker pull $NS/frontend:$VERSION"
            echo "docker pull $NS/pipeline:$VERSION"
            echo '```'
            echo
            echo "### Digests"
            echo '```'
            cat digests/*.txt
            echo '```'
            echo
            echo "### Install"
            echo
            echo "Download \`exactsurface-$VERSION.tar.gz\` below — it is the whole"
            echo "deployment. No source code and no build step."
            echo
            echo '```bash'
            echo "tar xzf exactsurface-$VERSION.tar.gz && cd exactsurface-$VERSION"
            echo "cp .env.example .env      # paste your licence, set DOMAIN + passwords"
            echo "docker compose up -d"
            echo "docker compose logs api | grep 'license active'"
            echo '```'
            echo
            echo "Full instructions: \`docs/CLIENT_GUIDE.md\`."
          } > notes.md

      # What the customer actually receives. Assembled from the same files we run
      # ourselves rather than a second copy, so the shipped stack cannot drift from the
      # tested one.
      - name: Assemble the customer bundle
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify.outputs.version }}"
          NS=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          DIR="exactsurface-$VERSION"

          # deploy/ IS the bundle -- copied whole, not assembled from pieces. Anything
          # the compose file mounts lives beside it there, so the archive cannot ship
          # missing a file that the repo has (which is how the first attempt at this
          # would have failed: Caddyfile and the Prometheus config were still in
          # docker/, and Docker would have created a *directory* in place of the
          # missing config rather than erroring usefully).
          cp -r deploy "$DIR"
          cp docs/CLIENT_GUIDE.md "$DIR/INSTALL.md"

          # Pin the bundle to the version it was cut for. A bundle whose .env.example
          # names an older release would quietly install the wrong images.
          sed -i "s|^EXACTSURFACE_VERSION=.*|EXACTSURFACE_VERSION=$VERSION|" "$DIR/.env.example"
          sed -i "s|^EXACTSURFACE_REGISTRY=.*|EXACTSURFACE_REGISTRY=$NS|"    "$DIR/.env.example"

          # Prove the bundle is self-contained before shipping it: no build: sections
          # (the customer has no source) and no image left un-pinned.
          if grep -qE '^\s*build:' "$DIR/docker-compose.yml"; then
            echo "::error::customer bundle contains a build: section — it requires source code"; exit 1
          fi
          grep -q "EXACTSURFACE_VERSION=$VERSION" "$DIR/.env.example"

          # Every host path the compose file mounts must exist in the archive. Without
          # this the bundle can ship a compose file referencing a config it does not
          # contain, and the customer's first `up` fails in a way that points nowhere.
          missing=0
          for path in $(grep -oE '^\s+- \./[^:]+' "$DIR/docker-compose.yml" | sed 's|.*\./||'); do
            [ -e "$DIR/$path" ] || { echo "::error::bundle is missing $path, which docker-compose.yml mounts"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1

          tar czf "$DIR.tar.gz" "$DIR"
          echo "bundle: $(du -h "$DIR.tar.gz" | cut -f1)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ExactSurface ${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: exactsurface-${{ needs.verify.outputs.version }}.tar.gz
