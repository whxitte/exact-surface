# Release: cut a versioned, customer-installable build.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces, for that version:
#   * exactsurface/api, exactsurface/frontend, exactsurface/pipeline on Docker Hub
#     (tagged :X.Y.Z and :latest), with the licence verify-key and build id baked in
#   * a packaged Helm chart + image digests attached to a GitHub Release
#
# Required repository secrets:
#   DOCKERHUB_USERNAME    Docker Hub account that owns the exactsurface/* repos
#   DOCKERHUB_TOKEN       Docker Hub access token (not the password)
#   LICENSE_PUBLIC_KEY    Ed25519 PUBLIC key PEM — verify-only, safe to bake in.
#                         The PRIVATE key never touches CI; it stays on your machine
#                         and on the control plane.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0) — no leading v"
        required: true

permissions:
  contents: write # create the GitHub Release

env:
  REGISTRY_NAMESPACE: exactsurface

jobs:
  # A release must never ship a red build. This repeats CI deliberately: tags can be
  # pushed from a branch that never ran it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Version matches pyproject
        run: |
          PY_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$PY_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.v.outputs.version }} != pyproject version $PY_VERSION."
            echo "Bump pyproject.toml (and deploy/helm/exactsurface/Chart.yaml) before tagging."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            # api + frontend are pure interpreted/JS layers, so multi-arch is cheap.
            platforms: linux/amd64,linux/arm64
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            platforms: linux/amd64,linux/arm64
          - name: pipeline
            dockerfile: docker/Dockerfile.pipeline
            # amd64 only: this image compiles the Go recon toolchain, and building it
            # for arm64 under QEMU emulation takes hours. Nearly all customer servers
            # are amd64. Add linux/arm64 here if you ever need Graviton/Apple silicon.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}:${{ needs.verify.outputs.version }}
            ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_ID=${{ needs.verify.outputs.version }}
            LICENSE_PUBLIC_KEY=${{ secrets.LICENSE_PUBLIC_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ env.REGISTRY_NAMESPACE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*.txt

  release:
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Helm chart
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          # Keep the chart's versions in lockstep with the release so a customer can
          # never install a chart that points at a different appVersion.
          sed -i "s/^version:.*/version: $VERSION/" deploy/helm/exactsurface/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" deploy/helm/exactsurface/Chart.yaml
          helm lint deploy/helm/exactsurface
          helm package deploy/helm/exactsurface --destination ./dist

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Compose release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## ExactSurface $VERSION"
            echo
            echo "### Images"
            echo '```'
            echo "docker pull exactsurface/api:$VERSION"
            echo "docker pull exactsurface/frontend:$VERSION"
            echo "docker pull exactsurface/pipeline:$VERSION"
            echo '```'
            echo
            echo "### Digests"
            echo '```'
            cat digests/*.txt
            echo '```'
            echo
            echo "Customer install: see \`docs/CLIENT_GUIDE.md\`."
          } > notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ExactSurface ${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: dist/*.tgz
