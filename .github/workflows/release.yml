# Release: cut a versioned, customer-installable build.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces, for that version:
#   * api, frontend and pipeline images on GHCR (ghcr.io), tagged :X.Y.Z and :latest,
#     with the licence verify-key and build id baked in
#   * a GitHub Release recording the image digests
#
# Registry: GHCR, not Docker Hub. Docker Hub's free tier allows only ONE private repo
# and we publish three images; GHCR gives unlimited private packages and authenticates
# with the built-in GITHUB_TOKEN, so there are no registry secrets to manage.
#
# Required repository secret (one):
#   LICENSE_PUBLIC_KEY    Ed25519 PUBLIC key PEM — verify-only, safe to bake in.
#                         The PRIVATE key never touches CI; it stays on your machine
#                         and on the control plane.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0) — no leading v"
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

env:
  # ghcr.io/<owner>/<image> — lowercased at use, since GHCR rejects uppercase paths.
  REGISTRY_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  # A release must never ship a red build. This repeats CI deliberately: tags can be
  # pushed from a branch that never ran it.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Version matches pyproject
        run: |
          PY_VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$PY_VERSION" != "${{ steps.v.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.v.outputs.version }} != pyproject version $PY_VERSION."
            echo "Bump pyproject.toml before tagging."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install + test
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            # api + frontend are pure interpreted/JS layers, so multi-arch is cheap.
            platforms: linux/amd64,linux/arm64
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            platforms: linux/amd64,linux/arm64
          - name: pipeline
            dockerfile: docker/Dockerfile.pipeline
            # amd64 only: this image compiles the Go recon toolchain, and building it
            # for arm64 under QEMU emulation takes hours. Nearly all customer servers
            # are amd64. Add linux/arm64 here if you ever need Graviton/Apple silicon.
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase the registry namespace (GHCR requires it)
        id: ns
        run: echo "value=$(echo '${{ env.REGISTRY_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ns.outputs.value }}/${{ matrix.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.ns.outputs.value }}/${{ matrix.name }}:latest
          build-args: |
            BUILD_ID=${{ needs.verify.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            LICENSE_PUBLIC_KEY=${{ secrets.LICENSE_PUBLIC_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.ns.outputs.value }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}" \
            > "digests/${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}
          path: digests/*.txt

  release:
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Compose release notes
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          {
            echo "## ExactSurface $VERSION"
            echo
            NS=$(echo "ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "### Images"
            echo '```'
            echo "docker pull $NS/api:$VERSION"
            echo "docker pull $NS/frontend:$VERSION"
            echo "docker pull $NS/pipeline:$VERSION"
            echo '```'
            echo
            echo "### Digests"
            echo '```'
            cat digests/*.txt
            echo '```'
            echo
            echo "Customer install: see \`docs/CLIENT_GUIDE.md\`."
          } > notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ExactSurface ${{ needs.verify.outputs.version }}
          tag_name: v${{ needs.verify.outputs.version }}
          body_path: notes.md
