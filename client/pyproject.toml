[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exactsurface-client"
version = "1.4.0"
description = "ExactSurface from the terminal and from AI agents: the `exactsurface` CLI and the `exactsurface-mcp` MCP server, over one scoped API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["mcp>=2,<3", "httpx>=0.27", "typer>=0.12", "rich>=13"]

[project.urls]
Homepage = "https://github.com/whxitte/exact-surface"
Documentation = "https://github.com/whxitte/exact-surface/blob/main/client/README.md"

[project.scripts]
exactsurface = "exactsurface_client.cli:main"
exactsurface-mcp = "exactsurface_client.mcp_server:main"

[tool.setuptools]
packages = ["exactsurface_client"]
