# ExactSurface Helm values. Override per environment.

image:
  api: exactsurface/api:latest
  pipeline: exactsurface/pipeline:latest
  pullPolicy: IfNotPresent

# External datastores (self-hosted or managed). Provided via the exactsurface-secrets Secret.
existingSecret: exactsurface-secrets

env: prod

api:
  replicas: 2
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "500m", memory: "512Mi" }
  service:
    port: 8000

# Stateless scan workers — scale to concurrent-scan load (§3.8).
# EXACTSURFACE_WORKER_FLEET_SIZE is templated from `replicas`, so scaling here stays
# safe. If you add an HPA, that breaks: set EXACTSURFACE_WORKER_FLEET_SIZE to maxReplicas
# explicitly, or a scaled-out fleet in Redis-down mode exceeds the per-target
# politeness cap (ADR-0012).
worker:
  replicas: 3
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }

# The scheduler is a singleton (enqueues due jobs).
scheduler:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

# Each process serves its own registry (ADR-0011) — there is no shared store, so
# the worker/scheduler must be scraped directly or every scanning metric is lost.
# Annotation-based discovery is used for portability; if you run the Prometheus
# Operator, add a PodMonitor selecting `app.kubernetes.io/component in
# (worker, scheduler)` on the `metrics` port instead.
metrics:
  enabled: true
  port: 9100

ingress:
  enabled: true
  className: nginx
  host: api.exactsurface.com
  tls: true
