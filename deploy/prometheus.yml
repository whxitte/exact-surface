# Prometheus scrape config for the local/self-hosted stack.
#
# Each ExactSurface process owns its own in-memory registry (core.metrics), so each is
# scraped separately — there is no shared store to read from one place. The API
# serves /metrics from its own app; the worker and scheduler serve it from the
# stdlib listener in daemon.metrics_server on EXACTSURFACE_METRICS_PORT (default 9100).
#
# `worker` runs with replicas, so a static target would silently scrape whichever
# replica DNS happened to return and under-report the fleet. dns_sd_configs
# resolves every A record compose publishes for the service name, so each replica
# becomes its own target with its own `instance` label.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: exactsurface-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: exactsurface-scheduler
    static_configs:
      - targets: ["scheduler:9100"]

  - job_name: exactsurface-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
