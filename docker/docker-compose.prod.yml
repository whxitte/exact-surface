# Production stack. Standalone (not an override of docker-compose.yml) because it
# differs in ways an override cannot express — most importantly it must NOT publish
# the datastore ports, and compose merges port lists rather than removing them.
#
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# What makes this "prod", vs the dev stack:
#   * Mongo and Redis are on the internal network ONLY — no host ports. An exposed,
#     unauthenticated datastore is the classic breach; here they are neither.
#   * Both require auth (credentials from the environment, never defaulted).
#   * VANTARI_ENV=prod, which makes Settings.assert_prod_safe() refuse insecure
#     secrets and the lab-private scope bypass.
#   * The API and frontend are not published either — Caddy is the single ingress
#     and terminates TLS.
#
# Required environment (set in an untracked .env alongside this file, or exported):
#   DOMAIN, MONGO_ROOT_USER, MONGO_ROOT_PASSWORD, REDIS_PASSWORD,
#   GRAFANA_ADMIN_PASSWORD, plus the VANTARI_ secrets from .env.example
#   (VANTARI_JWT_SECRET, VANTARI_SECRET_HASH_KEY, …).
name: vantari-prod

# Auth-carrying connection strings, injected into every backend service. Kept in one
# anchor so the credentials are defined once.
x-backend-env: &backend-env
  VANTARI_ENV: prod
  VANTARI_MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
  VANTARI_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Root credentials are applied only on FIRST init of an empty data volume. To
      # enable auth on an existing volume you must migrate — see docs/DEPLOYMENT.md.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    # No `ports:` — reachable only on the compose network, by service name.
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "yes"]
    environment:
      # redis-cli reads REDISCLI_AUTH automatically, so the healthcheck needs no
      # inline password (which would leak into the process list).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Heavy recon image; built once, reused by scheduler + workers. The dry-run gate
  # fails the stack fast if config/scope feeds are broken before anything scans.
  pipeline:
    image: vantari/pipeline:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    command: ["python", "-m", "daemon.main", "--dry-run"]
    env_file: ../.env
    environment: *backend-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    image: vantari/pipeline:latest
    command: ["python", "-m", "daemon.main"]
    env_file: ../.env
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      pipeline: { condition: service_started }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: vantari/pipeline:latest
    command: ["arq", "taskqueue.worker.WorkerSettings"]
    env_file: ../.env
    environment:
      <<: *backend-env
      # Must track `replicas` below: if Redis is down each worker enforces
      # 1/fleet_size of the per-target cap locally, so a value under the real replica
      # count lets a degraded fleet exceed the cap (ADR-0012).
      VANTARI_WORKER_FLEET_SIZE: "3"
    restart: unless-stopped
    deploy:
      replicas: 3
    depends_on:
      pipeline: { condition: service_started }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    image: vantari/api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file: ../.env
    environment: *backend-env
    restart: unless-stopped
    # No host port — reached only through Caddy (and scraped on the internal net).
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    image: vantari/frontend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      - API_PROXY_TARGET=http://api:8000
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }

  # Single public ingress. Terminates TLS (automatic Let's Encrypt for $DOMAIN) and
  # proxies to the frontend, which rewrites /api to the API internally.
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend: { condition: service_started }

  # -- observability (§7 Phase G) --
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api: { condition: service_started }

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # Required — no default. Compose errors if it is unset, which is the point:
      # Grafana can query every metric the platform emits.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Publish on loopback only, so an operator reaches it via an SSH tunnel rather
    # than the public internet. Put it behind Caddy with auth if you want it public.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      prometheus: { condition: service_started }

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
