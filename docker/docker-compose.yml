# Full local dev stack. `docker compose -f docker/docker-compose.yml up` gives the
# whole platform on any OS. MongoDB is self-hosted here (free) — no Atlas required.
name: exactsurface

# Inside the compose network Mongo/Redis are reached by SERVICE NAME (not localhost).
# These override the localhost defaults from ../.env for the backend services.
x-backend-env: &backend-env
  EXACTSURFACE_MONGO_URI: mongodb://mongo:27017
  EXACTSURFACE_REDIS_URI: redis://redis:6379/0
  # The licence, passed through from the host environment. Without these two lines
  # `EXACTSURFACE_LICENSE=… docker compose up` set the variable on the compose CLI and
  # nowhere else: the containers never saw it, compose reported the services already
  # "Running" because nothing about them had changed, and the app sat in read-only mode
  # insisting no licence was configured. Empty is equivalent to unset (core.entitlements
  # tests the token for truthiness), so leaving them off the host env is harmless.
  #
  # Not listed here: EXACTSURFACE_LICENSE_PUBLIC_KEY. It is baked into the image as an
  # ENV at build time, and a `${…:-}` default would overwrite that with an empty string
  # for anyone who has not exported it -- turning a correctly-licensed deployment
  # read-only. Override it through ../.env, which only sets what it actually contains.
  EXACTSURFACE_LICENSE: ${EXACTSURFACE_LICENSE:-}
  EXACTSURFACE_LICENSE_FILE: ${EXACTSURFACE_LICENSE_FILE:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Heavy image with all recon tooling; built once, reused by scheduler + workers.
  pipeline:
    image: exactsurface/pipeline:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
      args:
        LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    command: ["python", "-m", "daemon.main", "--dry-run"]
    env_file: ../.env
    environment: *backend-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  scheduler:
    image: exactsurface/pipeline:latest
    command: ["python", "-m", "daemon.main"]
    env_file: ../.env
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      pipeline: { condition: service_started }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    image: exactsurface/pipeline:latest
    command: ["arq", "taskqueue.worker.WorkerSettings"]
    env_file: ../.env
    environment:
      <<: *backend-env
      # Must track `replicas` below. If Redis is down each worker falls back to a
      # local bucket at 1/this of the per-target ceiling; set it under the real
      # replica count and a degraded fleet scans over the cap (ADR-0012).
      EXACTSURFACE_WORKER_FLEET_SIZE: "2"
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      pipeline: { condition: service_started }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      # Without this a locally built image bakes an EMPTY verify key, so every licence
      # fails verification and the instance is read-only no matter what token you set.
      args:
        LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
    env_file: ../.env
    environment: *backend-env
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    image: exactsurface/frontend:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    environment:
      # Inside the compose network the API is reachable by service name.
      - API_PROXY_TARGET=http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_started }

  # -- observability (§7 Phase G) --------------------------------------------
  # Each process keeps its own in-memory registry, so Prometheus scrapes each one
  # separately: the API from its own app, the scheduler and every worker replica
  # from daemon.metrics_server. Neither of these publishes a port to the host —
  # reach them through Grafana, which is the only exposed entry point.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d of local TSDB is enough to investigate an unattended run without
      # unbounded disk growth on a single box.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api: { condition: service_started }

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # Dev-stack default. Change it (or set it in ../.env) before exposing this
      # anywhere reachable — Grafana can query every metric the platform emits.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus: { condition: service_started }

volumes:
  mongo_data:
  redis_data:
  prometheus_data:
  grafana_data:
