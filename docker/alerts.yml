# Prometheus alert rules.
#
# These are deliberately few. Every rule here corresponds to something that is
# either an AUP/compliance breach or a silent stop of the product — an alert that
# fires for anything less trains an operator to ignore the channel.
#
# Thresholds reference real configured limits (core.config.Settings), NOT round
# numbers. If you change the setting, change the rule: they are duplicated here
# because Prometheus cannot read the app's config.
groups:
  - name: vantari-compliance
    rules:
      # §15 exit criterion: "naabu never exceeds the global rate cap (verified by
      # metrics)". This is the metric that verifies it. Pages because exceeding the
      # cap is an AUP breach against a third party, not a degraded-service issue.
      - alert: PortScanRateExceedsPolitenessCap
        expr: vantari_port_scan_per_target_pps > 10
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "Port scan exceeded the per-target politeness cap"
          description: >-
            naabu was handed {{ $value }} pps per target, above the
            VANTARI_GLOBAL_RATE_PER_TARGET cap of 10. A token bucket cannot govern a
            subprocess, so this means the derived --rate was wrong. Threshold must
            match global_rate_per_target.

      # Sustained throttling means the limiter is doing its job, but it also means
      # scans are being slowed — worth knowing, not worth waking someone.
      - alert: PolitenessThrottlingSustained
        expr: |
          rate(vantari_politeness_decisions_total{decision="throttled"}[15m])
            / clamp_min(rate(vantari_politeness_decisions_total[15m]), 0.001) > 0.5
        for: 30m
        labels: { severity: warn }
        annotations:
          summary: "Over half of politeness decisions have been throttled for 30m"

  - name: vantari-liveness
    rules:
      # The scheduler is the single point whose silent death stops ALL scanning.
      # run_forever() swallows tick exceptions so the process stays up and the port
      # keeps answering while nothing is ever enqueued again — a plain "is it up?"
      # check cannot see this. Tick is 60s; 10m is ~10 missed ticks.
      - alert: SchedulerNotTicking
        expr: time() - vantari_scheduler_last_success_timestamp > 600
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "No successful scheduler tick in over 10 minutes"
          description: >-
            The scheduler process may be up and still enqueueing nothing. Check
            vantari_scheduler_ticks_total{status="failed"} and the process logs.

      # Absent (not just failing) — covers the crashed/unscheduled case that the
      # gauge above cannot report, because a dead process reports nothing at all.
      - alert: VantariProcessDown
        expr: up{job=~"vantari-.*"} == 0
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is unreachable"

  - name: vantari-pipeline-health
    rules:
      # A stage that quietly starts timing out is the Phase G failure mode: scans
      # "succeed" with missing data and nobody notices for days.
      - alert: ScanStageFailureRateHigh
        expr: |
          sum by (stage) (rate(vantari_scan_stage_total{status=~"failed|timeout"}[1h]))
            / clamp_min(sum by (stage) (rate(vantari_scan_stage_total[1h])), 0.001) > 0.25
        for: 1h
        labels: { severity: warn }
        annotations:
          summary: "Stage {{ $labels.stage }} is failing/timing out >25% of runs"
